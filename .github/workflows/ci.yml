name: CI

on:
  pull_request:
  push:
    # dev push CI 제거 (2026-05-27, proposal ci-hybrid-runner-setup #step-1).
    # PR CI가 이미 동일 commit 검증 → dev push CI는 중복. dev → main PR에서 재검증 안전망.
    branches: [main]

# 전 job GitHub-hosted 단일화 (2026-07-26).
# 배경: dev 향 PR 만 Mac Studio cp-runner(self-hosted) 6기로 돌리던 hybrid 구성이었는데,
#   ① 이 repo 는 PUBLIC → GitHub-hosted 분(minutes) 이 무료·무제한이라 cp-runner 의 원래 명분(비용)이 없다.
#   ② 측정 결과 cp-runner 27m vs GitHub-hosted 10m — 느리기까지 했다 (Rosetta·단일 WAN 업링크).
#   ③ self-hosted 전용 우회들(npm cache OFF, .next/cache 조건부, /ms-playwright 경로 분기)이
#      RCA 부채로 누적돼 워크플로가 읽기 어려워졌다 — 그 분기들을 전부 삭제했다.
#   ④ class-planner 신규 개발이 멈춘 상태에서 러너 6기가 상시 RAM 3.7GB 를 점유하고 있었다 → 정지·회수.
# cp-runner 로 되돌리려면 `bash dev-pack/scripts/cp-runner-up.sh all` 로 컨테이너를 되살리고
# runs-on 을 `["self-hosted","docker"]` 로 바꾸면 된다 (러너 등록은 GitHub 에 남아 있다).

# Concurrency 가드 (2026-05-29):
# 같은 PR(또는 ref)에 새 commit push 시 in-flight run 즉시 취소 → 러너 슬롯 즉시 해제.
# head_ref(PR source branch) 우선, push 시 ref fallback.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type check, Lint, Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # D-lite optimization (2026-05-28, proposal ci-runner-docker-prebake #step-2):
          # cp-runner Docker image 의 baked-in node 22 와 일치. 20 명시 시 self-hosted에서
          # fresh download 10분 발생 (toolcache mismatch). 22 명시 시 image의 /usr/bin/node 활용 가능.
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run test
        env:
          # PR #428 sub-fix: vitest OOM (4GB heap default 부족). 본 PR의 PdfExportRangeModal
          # test fixture 추가로 누적 메모리 4GB 초과 — heap 늘림.
          NODE_OPTIONS: --max-old-space-size=6144

  build:
    name: Production build
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # D-lite optimization (2026-05-28, proposal ci-runner-docker-prebake #step-2):
          # cp-runner Docker image 의 baked-in node 22 와 일치. 20 명시 시 self-hosted에서
          # fresh download 10분 발생 (toolcache mismatch). 22 명시 시 image의 /usr/bin/node 활용 가능.
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # Next.js incremental build cache (2026-05-29, proposal ci-resource-budget-step-by-step #step-4):
      # .next/cache 는 Next.js 의 webpack/SWC compile artifact + fetch cache.
      # 같은 PR 의 ts/tsx 일부만 변경되면 cache hit → incremental compile (build 1-2m → 30s-1m).
      # key: package-lock + 모든 js/jsx/ts/tsx 의 content hash. restore-keys partial fallback.
      # SSOT: dev-pack/proposed-tasks/class-planner/ci-resource-budget-step-by-step.md § Step 4
      - name: Cache .next/cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.{js,jsx,ts,tsx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-nextjs-
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  # E2E test user 6 셋업 — 전용 job (2026-05-29, RCA ci-self-hosted-cache-stall).
  # 배경: 기존엔 e2e matrix 의 `if: matrix.shard == 1` step 이 6 user 를 셋업했는데,
  # shard 1 의 setup 이 끝나기 전에 다른 shard 의 globalSetup 이 academy_members 를
  # 읽는 race 가 있었다. cache stall(setup-node 8-10m)이 우연히 buffer 를 제공해
  # 가려져 있었으나, cache OFF 후 모든 shard 가 ~동시 시작하며 race 표면화
  # (shard 5 가 shard 1 setup 보다 73초 먼저 globalSetup → academy_members 부재 fail).
  # → 셋업을 별도 job 으로 분리하고 e2e 가 needs 로 의존 → 모든 shard 시작 전 완료 보장.
  setup-users:
    name: Setup E2E test users
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          # RCA 2026-05-29: self-hosted npm cache OFF (WAN blob stall 회피). 본 job § Build 참조.
          cache: "npm"
      - run: npm ci
      # 옵션 A (2026-05-28, proposal ci-shard-user-isolation):
      # script 가 6 user (e2e-test-1~6@class-planner.test) 모두 idempotent 셋업.
      # continue-on-error: secrets 누락 시 graceful skip (globalSetup 이 명확한 error 표면화).
      - name: Setup E2E test users (6 idempotent)
        run: npx tsx scripts/setup-e2e-test-user.ts
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          E2E_USER_PASSWORD_2: ${{ secrets.E2E_USER_PASSWORD_2 }}
          E2E_USER_PASSWORD_3: ${{ secrets.E2E_USER_PASSWORD_3 }}
          E2E_USER_PASSWORD_4: ${{ secrets.E2E_USER_PASSWORD_4 }}
          E2E_USER_PASSWORD_5: ${{ secrets.E2E_USER_PASSWORD_5 }}
          E2E_USER_PASSWORD_6: ${{ secrets.E2E_USER_PASSWORD_6 }}

  e2e:
    # main 향 = ubuntu + 4 shard 병렬 (parallel coverage) — user 1-4 각자 다른 user.
    # dev 향 (no label) = Mac Studio + 6 shard 병렬 — user 1-6 각자 다른 user (race window 영구 해소).
    # dev 향 + `quick-pr` label = Mac Studio + 1 shard (user 1) — 자원 효율 (단일 cp-runner 점유).
    #
    # 옵션 A (2026-05-28, proposal ci-shard-user-isolation):
    # 각 shard 가 다른 supabase user 사용 → DB row 격리 → academy data race 0.
    # user_index = shard 의 user 번호 (1-6).
    # password_secret = 해당 user 의 GitHub secret 명 (USER_1 은 기존 E2E_TEST_USER_PASSWORD 활용).
    #
    # quick-pr label 분기 (2026-05-29, proposal claude-md-phase-3-slim follow-up #step-1):
    # ai-pr-label-policy.md § quick-pr 의 옵션 D 적용. 작은 PR (docs/fix typo/lint fix/단일 file)
    # 시 quick-pr label 부여 → single shard 진행 → cp-runner 1개만 점유, 다른 PR 와 동시 진행 가능.
    # user 1 사용 — 동시 PR 의 dev full 6 shard 의 shard 1 과 user 1 충돌 가능 (운영 측정 후 mitigation).
    # SSOT: dev-pack/docs/protocols/ai-pr-label-policy.md
    name: E2E tests (shard ${{ matrix.shard }}/${{ matrix.total }} — user ${{ matrix.user_index }})
    # needs: setup-users 추가 (2026-05-29, RCA) — 모든 shard 가 user 6 셋업 완료 후 시작.
    # 기존 `if: matrix.shard == 1` in-job setup 의 race 제거 (shard 5 가 shard 1 setup 전
    # globalSetup 실행 → academy_members 부재 fail. cache stall 이 가렸다가 cache OFF 후 표면화).
    needs: [build, setup-users]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(contains(github.event.pull_request.labels.*.name, 'quick-pr') && '[{"shard":1,"total":1,"user_index":1,"password_secret":"E2E_TEST_USER_PASSWORD"}]' || '[{"shard":1,"total":4,"user_index":1,"password_secret":"E2E_TEST_USER_PASSWORD"},{"shard":2,"total":4,"user_index":2,"password_secret":"E2E_USER_PASSWORD_2"},{"shard":3,"total":4,"user_index":3,"password_secret":"E2E_USER_PASSWORD_3"},{"shard":4,"total":4,"user_index":4,"password_secret":"E2E_USER_PASSWORD_4"}]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # D-lite optimization (2026-05-28, proposal ci-runner-docker-prebake #step-2):
          # cp-runner Docker image 의 baked-in node 22 와 일치. 20 명시 시 self-hosted에서
          # fresh download 10분 발생 (toolcache mismatch). 22 명시 시 image의 /usr/bin/node 활용 가능.
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # Next.js incremental build cache (2026-05-29, proposal ci-resource-budget-step-by-step #step-4):
      # e2e job 의 webServer = `npm run build && npm run start` (playwright.config.ts) → build 재실행.
      # build job 의 cache 를 같은 key 로 restore → incremental compile.
      # 6 shard 모두 같은 key 로 restore (cloud cache 동시 접근 safe).
      - name: Cache .next/cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.{js,jsx,ts,tsx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-nextjs-
      # D-lite optimization (2026-05-28, proposal ci-runner-docker-prebake #step-2):
      # cp-runner Docker image 가 mcr.microsoft.com/playwright:v*-noble 기반 — chromium-1187
      # 이 /ms-playwright 에 baked-in (self-hosted/dev 향 → detect+재사용).
      # ubuntu (main 향) 에선 /ms-playwright 가 root 소유 → mkdir EACCES. 쓰기 가능한
      # runner 홈 캐시로 download (2026-05-30 fix — dev→main 첫 릴리즈서 표면화).
      - name: Install Playwright browsers
        run: npx playwright install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
      # E2E test user 6 셋업은 별도 setup-users job 으로 이동 (2026-05-29, RCA).
      # e2e 가 needs: setup-users 로 의존 → 모든 shard 시작 전 user 데이터 보장 (race 제거).
      - name: Run E2E tests
        run: |
          npx playwright test \
            tests/e2e/final-working-test.spec.ts \
            tests/e2e/schedule-multi-select-drag.spec.ts \
            tests/e2e/schedule-sync-network.spec.ts \
            tests/e2e/auth-flow.spec.ts \
            tests/e2e/teachers-crud.spec.ts \
            tests/e2e/templates-apply-delete.spec.ts \
            tests/e2e/schedule-conflict-auto-lane.spec.ts \
            tests/e2e/pdf-export.spec.ts \
            tests/e2e/mobile-flows.spec.ts \
            tests/e2e/offline-network.spec.ts \
            tests/e2e/schedule-viewmode.spec.ts \
            tests/e2e/share-link.spec.ts \
            tests/e2e/multi-academy.spec.ts \
            --shard=${{ matrix.shard }}/${{ matrix.total }} \
            --workers=4 \
            --project=chromium --reporter=list
        env:
          CI: "true"
          # D-lite (2026-05-28): image 의 chromium-1187 활용. playwright runtime 도 동일 path detect.
          # 설치 step 과 동일 경로 (ubuntu=runner 홈 캐시, self-hosted=/ms-playwright). 2026-05-30 fix.
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
          # E2E_DISABLE_SW=1 제거 (이전 PR R 우회). SW timing root cause fix
          # (sw.ts /api/* NetworkOnly + AuthGuard 7s) 후 e2e_pwa job 통합 — 모든
          # spec이 SW 활성 환경에서 실행. 환경 충실도 = production.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # 옵션 A (2026-05-28): 각 shard 가 다른 user 로 login → DB row 격리.
          # EMAIL hardcode (e2e-test-N@class-planner.test). PASSWORD 는 dynamic secret access.
          E2E_TEST_USER_EMAIL: e2e-test-${{ matrix.user_index }}@class-planner.test
          E2E_TEST_USER_PASSWORD: ${{ secrets[matrix.password_secret] }}
          # cleanup-test-data.ts 가 RLS 우회 위해 사용. 누락 시 cleanup 건너뜀(경고만).
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # T0' instrumentation (PR-α): fail 시 trace/screenshot/video/report artifact upload.
      # playwright.config.ts:trace='on-first-retry' + screenshot='only-on-failure' +
      # video='retain-on-failure' 로 이미 생성되지만 CI artifact 로 보존되지 않아
      # fail 후 분석 불가했음. 본 step 으로 GitHub Actions UI 에서 다운로드 가능.
      #
      # Step 3 변경: shard 별 artifact 분리 (matrix run 충돌 방지).
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-shard${{ matrix.shard }}-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # Step 3 (2026-05-28, proposal ci-resource-budget-step-by-step #step-3):
  # branch protection 의 required check 용 summary job.
  # e2e matrix 의 모든 shard 통과 시 success, 하나라도 fail/cancel 시 fail.
  # branch protection 에 "E2E all shards required" 1 context 만 추가하면 6 shard 모두 monitor.
  #
  # 배경: PR #553/#555/#556 같은 e2e fail 인데도 머지된 design issue 해소.
  # branch protection 의 required check 가 build 만이라 e2e job 의 fail 가 머지 차단 X.
  # matrix job 의 instance name 이 동적 (shard 1-6, user 1-6) 이라 직접 등록 어려움 → summary job 패턴.
  e2e-all-required:
    name: E2E all shards required
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all e2e shards passed
        run: |
          if [[ "${{ needs.e2e.result }}" != "success" ]]; then
            echo "❌ e2e matrix result = ${{ needs.e2e.result }} — block merge"
            exit 1
          fi
          echo "✅ all e2e shards passed"
