name: CI

on:
  pull_request:
  push:
    # dev push CI 제거 (2026-05-27, proposal ci-hybrid-runner-setup #step-1).
    # PR CI가 이미 동일 commit 검증 → dev push CI는 중복. dev → main PR에서 재검증 안전망.
    branches: [main]

# Hybrid runner 분기 (2026-05-27, proposal ci-hybrid-runner-setup #step-3):
#   - main 향 PR + push to main → ubuntu-latest (Linux production-parity)
#   - dev 향 PR → Mac Studio docker container runner (~2-3분, minutes 0 사용, network/cpu 격리)
# 분기 식: (github.event_name == 'push' || github.base_ref == 'main') && 'ubuntu-latest' || fromJSON('["self-hosted","docker"]')
# push event 는 on.push.branches 가 [main] 이라 main 만 트리거 → 항상 ubuntu.

jobs:
  check:
    name: Type check, Lint, Unit tests
    runs-on: ${{ (github.event_name == 'push' || github.base_ref == 'main') && 'ubuntu-latest' || fromJSON('["self-hosted","docker"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # D-lite optimization (2026-05-28, proposal ci-runner-docker-prebake #step-2):
          # cp-runner Docker image 의 baked-in node 22 와 일치. 20 명시 시 self-hosted에서
          # fresh download 10분 발생 (toolcache mismatch). 22 명시 시 image의 /usr/bin/node 활용 가능.
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run test
        env:
          # PR #428 sub-fix: vitest OOM (4GB heap default 부족). 본 PR의 PdfExportRangeModal
          # test fixture 추가로 누적 메모리 4GB 초과 — heap 늘림.
          NODE_OPTIONS: --max-old-space-size=6144

  build:
    name: Production build
    needs: check
    runs-on: ${{ (github.event_name == 'push' || github.base_ref == 'main') && 'ubuntu-latest' || fromJSON('["self-hosted","docker"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # D-lite optimization (2026-05-28, proposal ci-runner-docker-prebake #step-2):
          # cp-runner Docker image 의 baked-in node 22 와 일치. 20 명시 시 self-hosted에서
          # fresh download 10분 발생 (toolcache mismatch). 22 명시 시 image의 /usr/bin/node 활용 가능.
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  e2e:
    # main 향 = ubuntu + 4 shard 병렬 (parallel coverage) — user 1-4 각자 다른 user.
    # dev 향   = Mac Studio + 6 shard 병렬 — user 1-6 각자 다른 user (race window 영구 해소).
    #
    # 옵션 A (2026-05-28, proposal ci-shard-user-isolation):
    # 각 shard 가 다른 supabase user 사용 → DB row 격리 → academy data race 0.
    # user_index = shard 의 user 번호 (1-6).
    # password_secret = 해당 user 의 GitHub secret 명 (USER_1 은 기존 E2E_TEST_USER_PASSWORD 활용).
    name: E2E tests (shard ${{ matrix.shard }}/${{ matrix.total }} — user ${{ matrix.user_index }})
    needs: build
    runs-on: ${{ (github.event_name == 'push' || github.base_ref == 'main') && 'ubuntu-latest' || fromJSON('["self-hosted","docker"]') }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(
          (github.event_name == 'push' || github.base_ref == 'main')
            && '[{"shard":1,"total":4,"user_index":1,"password_secret":"E2E_TEST_USER_PASSWORD"},{"shard":2,"total":4,"user_index":2,"password_secret":"E2E_USER_PASSWORD_2"},{"shard":3,"total":4,"user_index":3,"password_secret":"E2E_USER_PASSWORD_3"},{"shard":4,"total":4,"user_index":4,"password_secret":"E2E_USER_PASSWORD_4"}]'
            || '[{"shard":1,"total":6,"user_index":1,"password_secret":"E2E_TEST_USER_PASSWORD"},{"shard":2,"total":6,"user_index":2,"password_secret":"E2E_USER_PASSWORD_2"},{"shard":3,"total":6,"user_index":3,"password_secret":"E2E_USER_PASSWORD_3"},{"shard":4,"total":6,"user_index":4,"password_secret":"E2E_USER_PASSWORD_4"},{"shard":5,"total":6,"user_index":5,"password_secret":"E2E_USER_PASSWORD_5"},{"shard":6,"total":6,"user_index":6,"password_secret":"E2E_USER_PASSWORD_6"}]'
        ) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # D-lite optimization (2026-05-28, proposal ci-runner-docker-prebake #step-2):
          # cp-runner Docker image 의 baked-in node 22 와 일치. 20 명시 시 self-hosted에서
          # fresh download 10분 발생 (toolcache mismatch). 22 명시 시 image의 /usr/bin/node 활용 가능.
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # D-lite optimization (2026-05-28, proposal ci-runner-docker-prebake #step-2):
      # cp-runner Docker image 가 mcr.microsoft.com/playwright:v*-noble 기반 — chromium-1187
      # 이 /ms-playwright 에 baked-in. PLAYWRIGHT_BROWSERS_PATH env 로 detect → skip.
      # --with-deps 제거 — image 안 system deps 이미 있음. ubuntu (main 향) 에선 매번 download.
      - name: Install Playwright browsers
        run: npx playwright install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      # 옵션 A (2026-05-28, proposal ci-shard-user-isolation):
      # script 가 6 user 모두 idempotent 셋업. shard 1 만 실행 — 다른 shard 는 spec login 만.
      # 모든 USER_PASSWORD_1~6 env 주입 (USER_1 은 legacy E2E_TEST_USER_PASSWORD).
      - name: Setup E2E test users (6 idempotent)
        if: matrix.shard == 1
        run: npx tsx scripts/setup-e2e-test-user.ts
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          E2E_USER_PASSWORD_2: ${{ secrets.E2E_USER_PASSWORD_2 }}
          E2E_USER_PASSWORD_3: ${{ secrets.E2E_USER_PASSWORD_3 }}
          E2E_USER_PASSWORD_4: ${{ secrets.E2E_USER_PASSWORD_4 }}
          E2E_USER_PASSWORD_5: ${{ secrets.E2E_USER_PASSWORD_5 }}
          E2E_USER_PASSWORD_6: ${{ secrets.E2E_USER_PASSWORD_6 }}
      - name: Run E2E tests
        run: |
          npx playwright test \
            tests/e2e/final-working-test.spec.ts \
            tests/e2e/schedule-multi-select-drag.spec.ts \
            tests/e2e/schedule-sync-network.spec.ts \
            tests/e2e/auth-flow.spec.ts \
            tests/e2e/teachers-crud.spec.ts \
            tests/e2e/templates-apply-delete.spec.ts \
            tests/e2e/schedule-conflict-auto-lane.spec.ts \
            tests/e2e/pdf-export.spec.ts \
            tests/e2e/mobile-flows.spec.ts \
            tests/e2e/offline-network.spec.ts \
            tests/e2e/schedule-viewmode.spec.ts \
            tests/e2e/share-link.spec.ts \
            tests/e2e/multi-academy.spec.ts \
            --shard=${{ matrix.shard }}/${{ matrix.total }} \
            --workers=4 \
            --project=chromium --reporter=list
        env:
          CI: "true"
          # D-lite (2026-05-28): image 의 chromium-1187 활용. playwright runtime 도 동일 path detect.
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
          # E2E_DISABLE_SW=1 제거 (이전 PR R 우회). SW timing root cause fix
          # (sw.ts /api/* NetworkOnly + AuthGuard 7s) 후 e2e_pwa job 통합 — 모든
          # spec이 SW 활성 환경에서 실행. 환경 충실도 = production.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # 옵션 A (2026-05-28): 각 shard 가 다른 user 로 login → DB row 격리.
          # EMAIL hardcode (e2e-test-N@class-planner.test). PASSWORD 는 dynamic secret access.
          E2E_TEST_USER_EMAIL: e2e-test-${{ matrix.user_index }}@class-planner.test
          E2E_TEST_USER_PASSWORD: ${{ secrets[matrix.password_secret] }}
          # cleanup-test-data.ts 가 RLS 우회 위해 사용. 누락 시 cleanup 건너뜀(경고만).
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # T0' instrumentation (PR-α): fail 시 trace/screenshot/video/report artifact upload.
      # playwright.config.ts:trace='on-first-retry' + screenshot='only-on-failure' +
      # video='retain-on-failure' 로 이미 생성되지만 CI artifact 로 보존되지 않아
      # fail 후 분석 불가했음. 본 step 으로 GitHub Actions UI 에서 다운로드 가능.
      #
      # Step 3 변경: shard 별 artifact 분리 (matrix run 충돌 방지).
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-shard${{ matrix.shard }}-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
