name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  check:
    name: Type check, Lint, Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run test

  build:
    name: Production build
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  e2e:
    name: E2E tests (Chromium)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      # PR C — Supabase test user 멱등 셋업. 매 CI마다 실행해도 안전:
      # 이미 존재하면 password 갱신, 없으면 신규 생성.
      # 사용자 측 setup script 로컬 실행 부담 제거 + GitHub secret 변경 시 자동 반영.
      # secrets 없으면 setup script가 graceful skip (exit 0 + 경고).
      - name: Setup E2E test user (idempotent)
        run: npx tsx scripts/setup-e2e-test-user.ts
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
      - name: Run E2E tests
        run: |
          npx playwright test \
            tests/e2e/final-working-test.spec.ts \
            tests/e2e/schedule-multi-select-drag.spec.ts \
            tests/e2e/schedule-sync-network.spec.ts \
            tests/e2e/auth-flow.spec.ts \
            tests/e2e/teachers-crud.spec.ts \
            tests/e2e/templates-apply-delete.spec.ts \
            tests/e2e/schedule-conflict-auto-lane.spec.ts \
            tests/e2e/pdf-export.spec.ts \
            tests/e2e/mobile-flows.spec.ts \
            tests/e2e/offline-network.spec.ts \
            tests/e2e/schedule-viewmode.spec.ts \
            tests/e2e/share-link.spec.ts \
            tests/e2e/multi-academy.spec.ts \
            --project=chromium --reporter=list
        env:
          CI: "true"
          # PR R — SW를 e2e production build에서 disable. SW activation timing이
          # auth-dependent specs (multi-academy/share-link/teachers/templates 등)에서
          # button visible timeout 유발. SW 자체 검증은 PR S의 별도 job (E2E_DISABLE_SW unset)로 분리.
          E2E_DISABLE_SW: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # PR C — Supabase password auth로 진짜 토큰 발급. 누락 시 globalSetup이 throw,
          # auth 의존 spec(teachers/templates/auth-flow Supabase 시나리오)만 영향.
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          # cleanup-test-data.ts 가 RLS 우회 위해 사용. 누락 시 cleanup 건너뜀(경고만).
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
