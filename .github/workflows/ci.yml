name: CI

on:
  pull_request:
  push:
    # dev push CI 제거 (2026-05-27, proposal ci-hybrid-runner-setup #step-1).
    # PR CI가 이미 동일 commit 검증 → dev push CI는 중복. dev → main PR에서 재검증 안전망.
    branches: [main]

# Hybrid runner 분기 (2026-05-27, proposal ci-hybrid-runner-setup #step-3):
#   - main 향 PR + push to main → ubuntu-latest (Linux production-parity)
#   - dev 향 PR → Mac Studio self-hosted runner (~2-3분, minutes 0 사용)
# 분기 식: (github.event_name == 'push' || github.base_ref == 'main') && 'ubuntu-latest' || fromJSON('["self-hosted","macOS","ARM64"]')
# push event 는 on.push.branches 가 [main] 이라 main 만 트리거 → 항상 ubuntu.

jobs:
  check:
    name: Type check, Lint, Unit tests
    runs-on: ${{ (github.event_name == 'push' || github.base_ref == 'main') && 'ubuntu-latest' || fromJSON('["self-hosted","macOS","ARM64"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run test
        env:
          # PR #428 sub-fix: vitest OOM (4GB heap default 부족). 본 PR의 PdfExportRangeModal
          # test fixture 추가로 누적 메모리 4GB 초과 — heap 늘림.
          NODE_OPTIONS: --max-old-space-size=6144

  build:
    name: Production build
    needs: check
    runs-on: ${{ (github.event_name == 'push' || github.base_ref == 'main') && 'ubuntu-latest' || fromJSON('["self-hosted","macOS","ARM64"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  e2e:
    # main 향 = ubuntu + 4 shard 병렬 (parallel coverage).
    # dev 향   = Mac Studio + 1 shard (single fast run).
    name: E2E tests (shard ${{ matrix.shard }}/${{ matrix.total }})
    needs: build
    runs-on: ${{ (github.event_name == 'push' || github.base_ref == 'main') && 'ubuntu-latest' || fromJSON('["self-hosted","macOS","ARM64"]') }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'push' || github.base_ref == 'main') && '[{"shard":1,"total":4},{"shard":2,"total":4},{"shard":3,"total":4},{"shard":4,"total":4}]' || '[{"shard":1,"total":1}]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      # PR C — Supabase test user 멱등 셋업. 매 CI마다 실행해도 안전:
      # 이미 존재하면 password 갱신, 없으면 신규 생성.
      # 사용자 측 setup script 로컬 실행 부담 제거 + GitHub secret 변경 시 자동 반영.
      # secrets 없으면 setup script가 graceful skip (exit 0 + 경고).
      #
      # Step 3 추가: shard 1 만 실행 (main 향 4-shard race window 완화).
      # 진짜 race-safe fix 는 별도 후속 — setup-e2e-test-user.ts 가 password 갱신 없이
      # user 존재만 확인하는 모드 추가 필요.
      - name: Setup E2E test user (idempotent)
        if: matrix.shard == 1
        run: npx tsx scripts/setup-e2e-test-user.ts
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
      - name: Run E2E tests
        run: |
          npx playwright test \
            tests/e2e/ \
            --shard=${{ matrix.shard }}/${{ matrix.total }} \
            --project=chromium --reporter=list
        env:
          CI: "true"
          # E2E_DISABLE_SW=1 제거 (이전 PR R 우회). SW timing root cause fix
          # (sw.ts /api/* NetworkOnly + AuthGuard 7s) 후 e2e_pwa job 통합 — 모든
          # spec이 SW 활성 환경에서 실행. 환경 충실도 = production.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # PR C — Supabase password auth로 진짜 토큰 발급. 누락 시 globalSetup이 throw,
          # auth 의존 spec(teachers/templates/auth-flow Supabase 시나리오)만 영향.
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          # cleanup-test-data.ts 가 RLS 우회 위해 사용. 누락 시 cleanup 건너뜀(경고만).
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # T0' instrumentation (PR-α): fail 시 trace/screenshot/video/report artifact upload.
      # playwright.config.ts:trace='on-first-retry' + screenshot='only-on-failure' +
      # video='retain-on-failure' 로 이미 생성되지만 CI artifact 로 보존되지 않아
      # fail 후 분석 불가했음. 본 step 으로 GitHub Actions UI 에서 다운로드 가능.
      #
      # Step 3 변경: shard 별 artifact 분리 (matrix run 충돌 방지).
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-shard${{ matrix.shard }}-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
