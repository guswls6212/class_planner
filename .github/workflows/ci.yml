name: CI

on:
  pull_request:
  push:
    # dev push CI 제거 (2026-05-27, proposal ci-hybrid-runner-setup #step-1).
    # PR CI가 이미 동일 commit 검증 → dev push CI는 중복. dev → main PR에서 재검증 안전망.
    branches: [main]

# Hybrid runner 분기 (2026-05-27, proposal ci-hybrid-runner-setup #step-3):
#   - main 향 PR + push to main → ubuntu-latest (Linux production-parity)
#   - dev 향 PR → Mac Studio docker container runner (~2-3분, minutes 0 사용, network/cpu 격리)
# 분기 식: (github.event_name == 'push' || github.base_ref == 'main') && 'ubuntu-latest' || fromJSON('["self-hosted","docker"]')
# push event 는 on.push.branches 가 [main] 이라 main 만 트리거 → 항상 ubuntu.

jobs:
  check:
    name: Type check, Lint, Unit tests
    runs-on: ${{ (github.event_name == 'push' || github.base_ref == 'main') && 'ubuntu-latest' || fromJSON('["self-hosted","docker"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run test
        env:
          # PR #428 sub-fix: vitest OOM (4GB heap default 부족). 본 PR의 PdfExportRangeModal
          # test fixture 추가로 누적 메모리 4GB 초과 — heap 늘림.
          NODE_OPTIONS: --max-old-space-size=6144

  build:
    name: Production build
    needs: check
    runs-on: ${{ (github.event_name == 'push' || github.base_ref == 'main') && 'ubuntu-latest' || fromJSON('["self-hosted","docker"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  # Step 1 분리 (2026-05-28, proposal ci-resource-budget-step-by-step #step-1):
  # supabase user setup 을 별도 job 으로 분리 — e2e-slow + e2e-fast 두 job 의
  # race window 회피 + 단일 호출로 idempotent 보장.
  setup-e2e-user:
    name: Setup E2E test user
    needs: build
    runs-on: ${{ (github.event_name == 'push' || github.base_ref == 'main') && 'ubuntu-latest' || fromJSON('["self-hosted","docker"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx tsx scripts/setup-e2e-test-user.ts
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}

  # Step 1 분리 (2026-05-28): slow 3 spec (auth/sync 무거움) 격리.
  # multi-academy / share-link / templates-apply-delete — 각 1.5-3분, 합쳐 7-8분.
  # main 향 = ubuntu 2 shard, dev 향 = Mac Studio 3 shard (각 1 spec 균등).
  e2e-slow:
    name: E2E slow (shard ${{ matrix.shard }}/${{ matrix.total }})
    needs: setup-e2e-user
    runs-on: ${{ (github.event_name == 'push' || github.base_ref == 'main') && 'ubuntu-latest' || fromJSON('["self-hosted","docker"]') }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'push' || github.base_ref == 'main') && '[{"shard":1,"total":2},{"shard":2,"total":2}]' || '[{"shard":1,"total":3},{"shard":2,"total":3},{"shard":3,"total":3}]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E slow specs
        run: |
          npx playwright test \
            tests/e2e/multi-academy.spec.ts \
            tests/e2e/share-link.spec.ts \
            tests/e2e/templates-apply-delete.spec.ts \
            --shard=${{ matrix.shard }}/${{ matrix.total }} \
            --workers=4 \
            --project=chromium --reporter=list
        env:
          CI: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Upload Playwright artifacts (slow)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-slow-shard${{ matrix.shard }}-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # Step 1 분리 (2026-05-28): fast 10 spec (가벼움).
  # main 향 = ubuntu 2 shard, dev 향 = Mac Studio 3 shard.
  e2e-fast:
    name: E2E fast (shard ${{ matrix.shard }}/${{ matrix.total }})
    needs: setup-e2e-user
    runs-on: ${{ (github.event_name == 'push' || github.base_ref == 'main') && 'ubuntu-latest' || fromJSON('["self-hosted","docker"]') }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'push' || github.base_ref == 'main') && '[{"shard":1,"total":2},{"shard":2,"total":2}]' || '[{"shard":1,"total":3},{"shard":2,"total":3},{"shard":3,"total":3}]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E fast specs
        run: |
          npx playwright test \
            tests/e2e/final-working-test.spec.ts \
            tests/e2e/schedule-multi-select-drag.spec.ts \
            tests/e2e/schedule-sync-network.spec.ts \
            tests/e2e/auth-flow.spec.ts \
            tests/e2e/teachers-crud.spec.ts \
            tests/e2e/schedule-conflict-auto-lane.spec.ts \
            tests/e2e/pdf-export.spec.ts \
            tests/e2e/mobile-flows.spec.ts \
            tests/e2e/offline-network.spec.ts \
            tests/e2e/schedule-viewmode.spec.ts \
            --shard=${{ matrix.shard }}/${{ matrix.total }} \
            --workers=4 \
            --project=chromium --reporter=list
        env:
          CI: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Upload Playwright artifacts (fast)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-fast-shard${{ matrix.shard }}-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
