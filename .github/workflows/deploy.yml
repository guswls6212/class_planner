name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "'latest' = main 재빌드 후 Mac Studio 가 자동 롤아웃. 특정 SHA = 배포 안 함(안내만) — SHA 고정은 Mac Studio 에서 --tag 로."
        required: false
        default: "latest"

jobs:
  build-image:
    name: Build & push Docker image
    # CI 자동 트리거 시: CI 성공한 경우만 빌드
    # 수동 dispatch 시: 'latest' 태그를 지정한 경우만 빌드 (특정 SHA 지정 시엔 이미 빌드된 이미지 사용)
    if: >
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag == 'latest')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set image tag
        id: meta
        run: |
          SHA=${{ github.event.workflow_run.head_sha || github.sha }}
          echo "sha_tag=${SHA::7}" >> $GITHUB_OUTPUT

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/guswls6212/class-planner:${{ steps.meta.outputs.sha_tag }}
            ghcr.io/guswls6212/class-planner:latest
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_ANALYTICS_URL=https://analytics.deepcraft.app
            NEXT_PUBLIC_ANALYTICS_TOKEN=${{ secrets.NEXT_PUBLIC_ANALYTICS_TOKEN }}
            NEXT_PUBLIC_OMNI_RADAR_URL=https://radar.deepcraft.app
            NEXT_PUBLIC_OMNI_RADAR_TOKEN=${{ secrets.NEXT_PUBLIC_OMNI_RADAR_TOKEN }}

  rollout:
    name: Rollout notice (Mac Studio agent pulls)
    needs: build-image
    # build-image 성공 시 실행. skipped 는 '의도적 SHA 지정'(workflow_dispatch + 특정 SHA)일 때만 허용.
    # CI 실패로 build 가 skip 된 경우엔 알림도 안 띄운다 — 안 그러면 직전 latest(stale)가 배포된 것처럼
    # 보고해 실패를 가린다 (proposal deploy-stale-on-ci-failure, 2026-06-02 omni-radar 배포 사고).
    # 주의: build 가 skip 되면 ghcr `latest` 가 그대로라 Mac Studio 에이전트도 아무것도 안 당긴다
    # (= stale 재배포 가드가 이 구조에서도 그대로 유효).
    if: >
      always() && (
        needs.build-image.result == 'success' ||
        (needs.build-image.result == 'skipped'
          && github.event_name == 'workflow_dispatch'
          && github.event.inputs.image_tag != 'latest')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.image_tag }}" != "latest" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ needs.build-image.outputs.image_tag || 'latest' }}" >> $GITHUB_OUTPUT
          fi

      # 프로덕션은 Mac Studio 의 pull 에이전트가 롤아웃한다 (2026-07-22 Lightsail 이전).
      # 여기서 SSH 배포를 하지 않는 이유: class_planner 는 PUBLIC repo 라 fork PR 이 워크플로의
      # runs-on 라벨을 자유롭게 지정할 수 있다. 배포용 self-hosted 러너에 docker socket 을 주면
      # 그 경로가 Mac Studio root 로 이어진다. 그래서 CI 는 이미지 push 까지만, 롤아웃은 호스트가
      # ghcr 를 폴링해서 당겨간다 (inbound 노출 0, CI 크리덴셜 0).
      # SSOT: dev-pack/proposed-tasks/class-planner/class-planner-autodeploy-reconnect.md
      - name: Check production liveness
        id: live
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://class-planner.deepcraft.app || echo 000)
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "현재 프로덕션 응답: HTTP $code (롤아웃 이전 시점 기준)"

      - name: Rollout summary
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          LIVE: ${{ steps.live.outputs.code }}
          DISPATCH_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          {
            echo "## 이미지 push 완료 — 롤아웃은 Mac Studio 가 수행"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| 이미지 | \`ghcr.io/guswls6212/class-planner:${TAG}\` |"
            echo "| 롤아웃 주체 | Mac Studio launchd 에이전트 (3분 주기 폴링) |"
            echo "| 예상 반영 | 최대 ~3분 + 컨테이너 부팅 |"
            echo "| 배포 직전 프로덕션 | HTTP ${LIVE} |"
            echo ""
            echo "> ⚠️ **이 초록 체크는 '이미지 push 성공'까지만 의미한다.** 프로덕션 반영 여부는"
            echo "> 아래 명령으로 실측할 것 (deploy success ≠ prod rolled)."
            echo ""
            echo '```bash'
            echo "# Mac Studio 에서 — 현재 서빙 버전 + 핀 상태"
            echo "bash ~/lee_file/entrepreneur/project/dev-pack/scripts/class-planner-deploy.sh --status"
            echo ""
            echo "# 기다리기 싫으면 즉시 당기기"
            echo "bash ~/lee_file/entrepreneur/project/dev-pack/scripts/class-planner-deploy.sh"
            echo '```'
            echo ""
            echo "### 롤백 (문제 생겼을 때)"
            echo '```bash'
            echo "# 직전 버전으로 (자동 롤포워드 방지 핀이 함께 걸림)"
            echo "bash ~/lee_file/entrepreneur/project/dev-pack/scripts/class-planner-deploy.sh --rollback"
            echo ""
            echo "# 특정 SHA 로 고정"
            echo "bash ~/lee_file/entrepreneur/project/dev-pack/scripts/class-planner-deploy.sh --tag <sha7>"
            echo ""
            echo "# 복구 끝나면 핀 해제 → latest 자동 추종 재개"
            echo "bash ~/lee_file/entrepreneur/project/dev-pack/scripts/class-planner-deploy.sh --unpin"
            echo '```'
            if [ -n "${DISPATCH_TAG}" ] && [ "${DISPATCH_TAG}" != "latest" ]; then
              echo ""
              echo "### ❗ 특정 SHA 를 dispatch 했지만 이 워크플로는 배포하지 않는다"
              echo "에이전트는 \`latest\` 를 추종하므로, 특정 SHA 고정은 **Mac Studio 에서만** 가능하다:"
              echo '```bash'
              echo "bash ~/lee_file/entrepreneur/project/dev-pack/scripts/class-planner-deploy.sh --tag ${DISPATCH_TAG}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${LIVE}" != "200" ]; then
            echo "::warning::배포 직전 프로덕션이 HTTP ${LIVE} 였다. Mac Studio 상태 확인 필요."
          fi
